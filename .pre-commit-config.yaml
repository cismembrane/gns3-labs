---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '(\.gns3$|\.svg$|/(configs|outputs|captures)/)'
      - id: end-of-file-fixer
        exclude: '(\.gns3$|\.svg$|/(configs|outputs|captures)/)'
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: 'group_vars/routers\.yml$'
      - id: check-merge-conflict

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.4.0
    hooks:
      - id: ansible-lint
        additional_dependencies:
          - ansible-core>=2.16

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  # Scoped to the NetBox lab's scripts. The older restconf-netconf-scripts predate
  # this hook and are not formatted to ruff's defaults; widening the scope means
  # reformatting them in the same commit, which is a separate change.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        files: '^netbox-source-of-truth/scripts/.*\.py$'
      - id: ruff-format
        files: '^netbox-source-of-truth/scripts/.*\.py$'
