[defaults]
# The live source of truth. Requires NETBOX_API and NETBOX_TOKEN in the environment.
# To run against the committed fixture instead (no NetBox needed):
#   ansible-playbook -i inventory/netbox-export.yml render.yml
inventory = inventory/netbox.yml
host_key_checking = False
timeout = 30

[persistent_connection]
connect_timeout = 30
command_timeout = 120
