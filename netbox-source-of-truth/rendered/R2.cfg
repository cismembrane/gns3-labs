hostname R2
!
interface GigabitEthernet0/0
 description to_r1
 ip address 10.0.1.2 255.255.255.248
 no shutdown
!
interface GigabitEthernet0/1
 description to_r3
 ip address 10.0.2.2 255.255.255.248
 no shutdown
!
interface Loopback0
 description router_id
 ip address 2.2.2.2 255.255.255.255
 no shutdown
!
router bgp 65002
 bgp router-id 2.2.2.2
 bgp log-neighbor-changes
 neighbor 10.0.1.1 remote-as 65001
 neighbor 10.0.1.1 description bgp_to_r1
 neighbor 10.0.2.3 remote-as 65003
 neighbor 10.0.2.3 description bgp_to_r3
 address-family ipv4
  network 2.2.2.2 mask 255.255.255.255
  network 10.0.1.0 mask 255.255.255.248
  network 10.0.2.0 mask 255.255.255.248
  neighbor 10.0.1.1 activate
  neighbor 10.0.2.3 activate
 exit-address-family
