hostname R1
!
interface GigabitEthernet0/0
 description to_r2
 ip address 10.0.1.1 255.255.255.248
!
interface GigabitEthernet0/3
 description to_r4
 ip address 10.0.4.1 255.255.255.248
!
interface Loopback0
 description router_id
 ip address 1.1.1.1 255.255.255.255
!
router bgp 65001
 bgp router-id 1.1.1.1
 bgp log-neighbor-changes
 neighbor 10.0.1.2 remote-as 65002
 neighbor 10.0.1.2 description bgp_to_r2
 neighbor 10.0.4.4 remote-as 65004
 neighbor 10.0.4.4 description bgp_to_r4
 address-family ipv4
  network 1.1.1.1 mask 255.255.255.255
  network 10.0.1.0 mask 255.255.255.248
  network 10.0.4.0 mask 255.255.255.248
  neighbor 10.0.1.2 activate
  neighbor 10.0.4.4 activate
 exit-address-family
