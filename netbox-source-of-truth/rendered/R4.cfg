hostname R4
!
interface GigabitEthernet0/2
 description to_r3
 ip address 10.0.3.4 255.255.255.248
!
interface GigabitEthernet0/3
 description to_r1
 ip address 10.0.4.4 255.255.255.248
!
interface Loopback0
 description router_id
 ip address 4.4.4.4 255.255.255.255
!
router bgp 65004
 bgp router-id 4.4.4.4
 bgp log-neighbor-changes
 neighbor 10.0.3.3 remote-as 65003
 neighbor 10.0.3.3 description bgp_to_r3
 neighbor 10.0.4.1 remote-as 65001
 neighbor 10.0.4.1 description bgp_to_r1
 address-family ipv4
  network 4.4.4.4 mask 255.255.255.255
  network 10.0.3.0 mask 255.255.255.248
  network 10.0.4.0 mask 255.255.255.248
  neighbor 10.0.3.3 activate
  neighbor 10.0.4.1 activate
 exit-address-family
