hostname R3
!
interface GigabitEthernet0/1
 description to_r2
 ip address 10.0.2.3 255.255.255.248
!
interface GigabitEthernet0/2
 description to_r4
 ip address 10.0.3.3 255.255.255.248
!
interface Loopback0
 description router_id
 ip address 3.3.3.3 255.255.255.255
!
router bgp 65003
 bgp router-id 3.3.3.3
 bgp log-neighbor-changes
 neighbor 10.0.2.2 remote-as 65002
 neighbor 10.0.2.2 description bgp_to_r2
 neighbor 10.0.3.4 remote-as 65004
 neighbor 10.0.3.4 description bgp_to_r4
 address-family ipv4
  network 3.3.3.3 mask 255.255.255.255
  network 10.0.2.0 mask 255.255.255.248
  network 10.0.3.0 mask 255.255.255.248
  neighbor 10.0.2.2 activate
  neighbor 10.0.3.4 activate
 exit-address-family
