---
# Install with: ansible-galaxy collection install -r requirements.yml
#
# Constrained to major versions. The compose file pins the NetBox image because
# NetBox renames API fields between minor releases; nb_inventory tracks those
# renames, so an unbounded collection install would defeat that pin. Each entry
# allows minor and patch updates and stops at the next major.
collections:
  # nb_inventory, the dynamic inventory plugin this lab is built on.
  - name: netbox.netbox
    version: ">=3.21.0,<4.0.0"
  # ios_config / ios_command for deploy, verify, and drift.
  - name: cisco.ios
    version: ">=11.0.0,<12.0.0"
  - name: ansible.netcommon
    version: ">=8.0.0,<9.0.0"
  # ipaddr filter, used by templates/interfaces.j2 to turn a NetBox CIDR into
  # the dotted-quad mask IOS wants.
  - name: ansible.utils
    version: ">=6.0.0,<7.0.0"
