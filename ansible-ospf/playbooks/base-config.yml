- name: Bootstrap base config on Cisco IOS routers
  hosts: ios
  gather_facts: false

  tasks:
    - name: Set hostname from inventory name
      cisco.ios.ios_config:
        lines:
          - "hostname {{ inventory_hostname }}"
      register: hostname_push

    - name: Apply base management config
      cisco.ios.ios_config:
        lines:
          - no ip domain-lookup
          - service timestamps debug datetime msec
          - service timestamps log datetime msec
          - login on-success log
          - login on-failure log
          - ip ssh version 2
          - ip ssh authentication-retries 3
        match: line
        replace: line
      register: base_push

    - name: Configure console line
      cisco.ios.ios_config:
        parents: line con 0
        lines:
          - logging synchronous
        match: line
        replace: line
      register: console_push

    - name: Restrict VTY transport to SSH
      cisco.ios.ios_config:
        parents: line vty 0 15
        lines:
          - transport input ssh
        match: line
        replace: line
      register: vty_push

    - name: Save running-config to startup-config
      cisco.ios.ios_config:
        save_when: modified

    - name: Report result
      ansible.builtin.debug:
        msg: >-
          Base config pushed on {{ inventory_hostname }}
          (changed={{ [hostname_push, base_push, console_push, vty_push]
                      | map(attribute='changed') | select | list | length > 0 }})
